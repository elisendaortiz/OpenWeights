[project]
name = "openweights"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "mcp>=2.3.0",
    "ollama>=0.6.3",
    "openai>=3.35.1",
    "pillow>=12,<13",
    "python-dotenv>=1.2.4",
